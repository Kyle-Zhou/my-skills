<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Diff Viewer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="repo-info" id="repo-info"></div>
      <button id="theme-toggle" class="theme-toggle" title="Toggle light/dark mode" aria-label="Toggle light/dark mode" role="switch" aria-checked="false">
        <span class="toggle-track">
          <span class="toggle-thumb">
            <svg class="icon icon-sun" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
            </svg>
            <svg class="icon icon-moon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </span>
        </span>
      </button>
    </header>
    <div class="body">
      <nav class="sidebar" id="file-list"></nav>
      <div class="sidebar-resizer" id="sidebar-resizer"></div>
      <main class="diff-panel" id="diff-panel">
        <div class="diff-scroll" id="diff-scroll">
          <div class="empty">Loading…</div>
        </div>
        <div class="diff-minimap" id="diff-minimap">
          <div class="diff-minimap-marks" id="diff-minimap-marks"></div>
          <div class="diff-minimap-thumb" id="diff-minimap-thumb"></div>
        </div>
      </main>
    </div>
  </div>
  <div class="selection-popup" id="selection-popup" hidden>
    <div class="selection-popup-row">
      <label for="selection-popup-text">Text</label>
      <textarea id="selection-popup-text" rows="6"></textarea>
      <button class="copy-btn" id="selection-copy-text" title="Copy text" aria-label="Copy text">
        <svg class="copy-icon" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5.5" y="5.5" width="8" height="9" rx="1.5"></rect>
          <path d="M3.5 10.5h-1a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h7a1 1 0 0 1 1 1v1"></path>
        </svg>
        <svg class="check-icon" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8l3.5 3.5L13 4.5"></path>
        </svg>
      </button>
    </div>
    <div class="selection-popup-row">
      <label for="selection-popup-ref">Ref</label>
      <input type="text" id="selection-popup-ref" />
      <button class="copy-btn" id="selection-copy-ref" title="Copy file name + line numbers" aria-label="Copy file name + line numbers">
        <svg class="copy-icon" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5.5" y="5.5" width="8" height="9" rx="1.5"></rect>
          <path d="M3.5 10.5h-1a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h7a1 1 0 0 1 1 1v1"></path>
        </svg>
        <svg class="check-icon" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8l3.5 3.5L13 4.5"></path>
        </svg>
      </button>
    </div>
  </div>
  <script src="highlight.js"></script>
  <script src="app.js"></script>
</body>
</html>
